<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown to PDF</title>

<!-- KaTeX for LaTeX math rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.28/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.28/dist/katex.min.js"></script>

<!-- highlight.js for syntax highlighting -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"></script>

<!-- markdown-it + plugins -->
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.1/dist/markdown-it.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/texmath.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/css/texmath.min.css">
<script src="https://cdn.jsdelivr.net/npm/markdown-it-sub@2/dist/markdown-it-sub.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-sup@2/dist/markdown-it-sup.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@4/dist/markdown-it-footnote.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-deflist@3/dist/markdown-it-deflist.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-abbr@2/dist/markdown-it-abbr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-emoji@3/dist/markdown-it-emoji.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-container@4/dist/markdown-it-container.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-ins@4/dist/markdown-it-ins.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-mark@4/dist/markdown-it-mark.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2/dist/markdown-it-task-lists.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-multimd-table@4/dist/markdown-it-multimd-table.min.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
  }

  /* ---------- App layout (hidden when printing) ---------- */
  .app-header {
    background: #1a1a2e;
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .app-header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
  }
  .app-header p {
    margin: 0;
    font-size: 13px;
    opacity: 0.7;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  .container {
    display: flex;
    height: calc(100vh - 56px);
    overflow: hidden;
  }

  /* Resize handle */
  .resize-handle {
    width: 5px;
    background: #e5e7eb;
    cursor: col-resize;
    flex-shrink: 0;
    position: relative;
    transition: background 0.15s;
  }
  .resize-handle:hover, .resize-handle.active {
    background: #2563eb;
  }
  .resize-handle::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: -4px;
    width: 13px;
  }
  body.resizing {
    cursor: col-resize;
    user-select: none;
  }
  body.resizing textarea {
    pointer-events: none;
  }
  body.resizing #preview {
    pointer-events: none;
  }

  /* Editor pane */
  .editor-pane {
    flex: 1 1 50%;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #ddd;
    background: #fff;
    min-height: 0;
    min-width: 200px;
  }
  .pane-toolbar {
    padding: 8px 12px;
    background: #fafafa;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .pane-toolbar span {
    font-size: 13px;
    font-weight: 600;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #editor {
    flex: 1;
    min-height: 0;
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: 16px 20px;
    overflow-y: auto;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    font-size: 14px;
    line-height: 1.6;
    color: #1a1a1a;
    background: #fff;
    tab-size: 2;
  }

  /* Preview pane */
  .preview-pane {
    flex: 1 1 50%;
    display: flex;
    flex-direction: column;
    background: #fff;
    min-height: 0;
    min-width: 200px;
  }
  #preview {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
  }

  /* Buttons */
  .btn {
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary {
    background: #2563eb;
    color: #fff;
  }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary {
    background: #e5e7eb;
    color: #374151;
  }
  .btn-secondary:hover { background: #d1d5db; }

  /* ---------- Preview / Print content styles ---------- */
  #preview h1 {
    font-size: 22px;
    margin: 0 0 12px 0;
    padding-bottom: 6px;
    border-bottom: 2px solid #333;
  }
  #preview h2 {
    font-size: 17px;
    margin: 20px 0 8px 0;
  }
  #preview h3 {
    font-size: 15px;
    margin: 16px 0 6px 0;
  }
  #preview p {
    margin: 6px 0;
    line-height: 1.7;
    text-align: justify;
  }
  #preview code {
    background: #f0f0f0;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 13px;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  #preview pre {
    background: #f5f5f5;
    padding: 12px 16px;
    border-radius: 6px;
    border: 1px solid #e0e0e0;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
  }
  #preview pre code {
    background: none;
    padding: 0;
  }
  #preview blockquote {
    border-left: 3px solid #999;
    margin: 12px 0;
    padding: 4px 0 4px 16px;
    color: #555;
  }
  #preview table {
    border-collapse: collapse;
    margin: 12px 0;
    width: 100%;
  }
  #preview th, #preview td {
    border: 1px solid #ccc;
    padding: 6px 12px;
    text-align: left;
  }
  #preview th {
    background: #f0f0f0;
    font-weight: 600;
  }
  #preview hr {
    border: none;
    border-top: 1px solid #ddd;
    margin: 20px 0;
  }
  #preview img {
    max-width: 100%;
  }
  /* KaTeX display math */
  #preview .katex-display {
    margin: 12px 0;
    overflow: visible;
  }
  /* Footnotes */
  #preview .footnotes-sep { margin-top: 24px; }
  #preview .footnotes { font-size: 13px; color: #555; }
  #preview sup.footnote-ref a { text-decoration: none; color: #2563eb; }
  /* Task lists */
  #preview .task-list-item { list-style: none; }
  #preview .task-list-item input[type="checkbox"] { margin: 0 6px 0 -20px; }
  /* Mark / Ins */
  #preview mark { background: #fff3a8; padding: 1px 3px; border-radius: 2px; }
  #preview ins { text-decoration: underline; color: #16a34a; }
  /* Definition lists */
  #preview dl { margin: 12px 0; }
  #preview dt { font-weight: 600; margin-top: 8px; }
  #preview dd { margin: 2px 0 8px 24px; }
  /* Strikethrough */
  #preview s, #preview del { color: #888; }
  /* Custom container: warning */
  #preview .warning { background: #fff8e1; border-left: 4px solid #ffb300; padding: 10px 16px; margin: 12px 0; border-radius: 4px; }
  /* Abbreviations */
  #preview abbr { cursor: help; text-decoration: underline dotted; }

  /* Pane toggle capsule */
  .pane-toggles {
    display: flex;
    border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    overflow: hidden;
  }
  .pane-toggle {
    padding: 5px 14px;
    border: none;
    border-radius: 0;
    background: transparent;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .pane-toggle + .pane-toggle {
    border-left: 1.5px solid rgba(255,255,255,0.3);
  }
  .pane-toggle.active {
    background: rgba(255,255,255,0.15);
    color: #fff;
  }
  .pane-toggle:hover:not(:disabled) {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }
  .pane-toggle:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* Hidden panes */
  .editor-pane.hidden,
  .preview-pane.hidden,
  .resize-handle.hidden { display: none; }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1a1a2e;
    color: #fff;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 1000;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---------- Print styles ---------- */
  @media print {
    html, body {
      height: auto;
      overflow: visible;
      background: #fff;
    }
    .app-header, .editor-pane, .pane-toolbar, .resize-handle { display: none !important; }
    .container {
      display: block;
      height: auto;
      overflow: visible;
    }
    .preview-pane {
      display: block;
      height: auto;
      overflow: visible;
      min-height: 0;
    }
    #preview {
      padding: 0;
      height: auto;
      overflow: visible;
      font-family: 'Times New Roman', Georgia, serif;
      font-size: 11.5pt;
      line-height: 1.65;
    }
    #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 {
      break-after: avoid;
    }
    #preview blockquote, #preview .katex-display {
      break-inside: avoid;
    }
    .toast { display: none !important; }
    @page { size: A4; margin: 2cm 2.5cm; }
  }
</style>
</head>
<body>

<div class="app-header">
  <div>
    <h1>Markdown to PDF</h1>
    <p>Paste markdown with LaTeX math &mdash; print to PDF</p>
  </div>
  <div class="pane-toggles">
    <button id="toggleEditor" class="pane-toggle active" onclick="togglePane('editor')">Editor</button>
    <button id="togglePreview" class="pane-toggle active" onclick="togglePane('preview')">Preview</button>
  </div>
</div>

<div class="container">
  <div class="editor-pane">
    <div class="pane-toolbar">
      <span>Markdown</span>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-secondary" onclick="loadSample()">Sample</button>
        <button class="btn btn-secondary" onclick="clearEditor()">Clear</button>
      </div>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="Paste your markdown here..."></textarea>
  </div>

  <div class="resize-handle" id="resizeHandle"></div>

  <div class="preview-pane">
    <div class="pane-toolbar">
      <span>Preview</span>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-secondary" onclick="copyForWord()">Copy for MS Word</button>
        <button class="btn btn-primary" onclick="printPDF()">Save to PDF</button>
      </div>
    </div>
    <div id="preview"></div>
  </div>
</div>

<div id="toast" class="toast">Copied to clipboard!</div>

<script>
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');

  // Configure markdown-it with all plugins
  const md = window.markdownit({
    html: true,
    linkify: true,
    typographer: true,
    highlight: (str, lang) => {
      if (lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(str, { language: lang }).value; } catch (_) {}
      }
      return '';
    },
  })
  .use(texmath, { engine: katex, delimiters: 'dollars' })
  .use(markdownitSub)
  .use(markdownitSup)
  .use(markdownitFootnote)
  .use(markdownitDeflist)
  .use(markdownitAbbr)
  .use(markdownitEmoji)
  .use(markdownitContainer, 'warning')
  .use(markdownitIns)
  .use(markdownitMark)
  .use(markdownitTaskLists)
  .use(markdownitMultimdTable, { multiline: true, rowspan: true, headerless: false });

  md.linkify.set({ fuzzyEmail: false });

  // Expose instances for console customization
  window.md = md;

  function render() {
    preview.innerHTML = md.render(editor.value);
  }

  // Live preview on input
  let timeout;
  editor.addEventListener('input', () => {
    clearTimeout(timeout);
    timeout = setTimeout(render, 150);
  });

  // Tab key inserts spaces in editor
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 2;
      render();
    }
  });

  function clearEditor() {
    editor.value = '';
    render();
  }

  function loadSample() {
    editor.value = `# Sample Document

## Inline Math

The quadratic formula is $x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$.

## Display Equations

The Euler identity:

$$e^{i\\pi} + 1 = 0$$

A system of equations in matrix form:

$$\\begin{bmatrix} 2 & -1 & -1 \\\\ -1 & 2 & -1 \\\\ -1 & -1 & 2 \\end{bmatrix} \\begin{bmatrix} x \\\\ y \\\\ z \\end{bmatrix} = \\begin{bmatrix} 0 \\\\ 0 \\\\ 0 \\end{bmatrix}$$


### Table with Cell Spanning

| Category    | Q1      | Q2      | Status      |
|-------------|---------|---------|-------------|
| Sales       | $30,000 | $35,000 | On Track    |
| Engineering | $50,000 | $65,000 | On Track    |
| ^^          | $48,000 | $70,000 | Over Budget |
| Marketing   | $30,000 (combined) || Under Budget |
| **Total**          ||| Mixed       |

## Code (Syntax Highlighted)

\`\`\`python
def fibonacci(n):
    """Return the nth Fibonacci number."""
    a, b = 0, 1
    for _ in range(n):
        a, b = b, a + b
    return a
\`\`\`

\`\`\`javascript
const greet = (name) => \\\`Hello, \\\${name}!\\\`;
console.log(greet("world"));
\`\`\`

## Footnotes

This statement needs a citation[^1]. Another claim here[^note].

[^1]: First reference source.
[^note]: A longer footnote with more detail.

## Task List

- [x] Write the markdown parser
- [x] Add LaTeX math support
- [ ] Add syntax highlighting
- [ ] Deploy to production

## Text Formatting

- ~~Strikethrough~~ text
- H~2~O (subscript)
- x^2^ (superscript)
- ==highlighted text== (mark)
- ++inserted text++ (insert)

## Definition List

Markdown
:   A lightweight markup language for creating formatted text.

LaTeX
:   A document preparation system for high-quality typesetting.

## Abbreviation

*[HTML]: Hyper Text Markup Language
*[PDF]: Portable Document Format

This tool converts Markdown to HTML and then to PDF.

## Custom Container

::: warning
**Note:** This is a warning container for important callouts.
:::

## Emoji

That's a great idea! :tada: :rocket: :+1:

> This is a blockquote with **bold** and *italic* text.
`;
    render();
  }

  // Load sample on first visit
  if (!editor.value) loadSample();

  // ---------- Print settings (customizable from console) ----------
  window.printSettings = {
    fontFamily: "'Times New Roman', Georgia, serif",
    fontSize: '11.5pt',
    lineHeight: '1.65',
    pageSize: 'A4',
    marginTop: '2cm',
    marginBottom: '2cm',
    marginLeft: '2.5cm',
    marginRight: '2.5cm',
  };

  function printPDF() {
    const s = window.printSettings;
    const css = `@media print {
      #preview {
        font-family: ${s.fontFamily} !important;
        font-size: ${s.fontSize} !important;
        line-height: ${s.lineHeight} !important;
      }
      @page {
        size: ${s.pageSize};
        margin: ${s.marginTop} ${s.marginRight} ${s.marginBottom} ${s.marginLeft};
      }
    }`;
    let styleEl = document.getElementById('printOverrides');
    if (!styleEl) {
      styleEl = document.createElement('style');
      styleEl.id = 'printOverrides';
      document.head.appendChild(styleEl);
    }
    styleEl.textContent = css;
    window.print();
  }

  // ---------- Console welcome message ----------
  console.log(
    '%c Markdown to PDF %c Customizable Print Settings ',
    'background:#1a1a2e;color:#fff;padding:4px 8px;border-radius:4px 0 0 4px;font-weight:bold;',
    'background:#2563eb;color:#fff;padding:4px 8px;border-radius:0 4px 4px 0;'
  );
  console.log(
    '%cCustomize the PDF output right from this console.\n' +
    'Edit %cprintSettings%c then call %cprintPDF()%c.\n',
    'color:#555;font-size:12px;',
    'color:#2563eb;font-weight:bold;font-size:12px;',
    'color:#555;font-size:12px;',
    'color:#2563eb;font-weight:bold;font-size:12px;',
    'color:#555;font-size:12px;'
  );
  console.table(window.printSettings);
  console.log(
    '%cExamples:%c\n' +
    "  printSettings.fontSize   = '12pt'\n" +
    "  printSettings.fontFamily = \"'Arial', sans-serif\"\n" +
    "  printSettings.pageSize   = 'Letter'\n" +
    "  printSettings.marginTop  = '1.5cm'\n" +
    '  printPDF()',
    'color:#555;font-weight:bold;font-size:12px;',
    'color:#16a34a;font-family:monospace;font-size:11px;'
  );
  console.log(
    '\n%cExposed globals:%c\n' +
    '  katex       — KaTeX engine (math rendering)\n' +
    '  hljs        — highlight.js (syntax highlighting)\n' +
    '  md          — markdown-it instance (parser/renderer)\n' +
    '  render()    — re-render the preview\n',
    'color:#555;font-weight:bold;font-size:12px;',
    'color:#9333ea;font-family:monospace;font-size:11px;'
  );

  // ---------- Toggle panes ----------
  const _savedPaneStyles = { editor: {}, preview: {} };

  function togglePane(pane) {
    const editorPane = document.querySelector('.editor-pane');
    const previewPane = document.querySelector('.preview-pane');
    const handle = document.getElementById('resizeHandle');
    const btnEditor = document.getElementById('toggleEditor');
    const btnPreview = document.getElementById('togglePreview');

    const target = pane === 'editor' ? editorPane : previewPane;
    const other = pane === 'editor' ? previewPane : editorPane;

    // Don't hide if the other pane is already hidden
    if (!target.classList.contains('hidden') && other.classList.contains('hidden')) return;

    const isHiding = !target.classList.contains('hidden');

    if (isHiding) {
      // Save current inline styles before hiding
      _savedPaneStyles.editor = { width: editorPane.style.width, flex: editorPane.style.flex };
      _savedPaneStyles.preview = { width: previewPane.style.width, flex: previewPane.style.flex };

      target.classList.add('hidden');

      // Clear inline styles so the visible pane fills the container
      editorPane.style.width = '';
      editorPane.style.flex = '';
      previewPane.style.width = '';
      previewPane.style.flex = '';
    } else {
      target.classList.remove('hidden');

      // Restore saved inline styles from before the pane was hidden
      editorPane.style.width = _savedPaneStyles.editor.width || '';
      editorPane.style.flex = _savedPaneStyles.editor.flex || '';
      previewPane.style.width = _savedPaneStyles.preview.width || '';
      previewPane.style.flex = _savedPaneStyles.preview.flex || '';
    }

    const editorHidden = editorPane.classList.contains('hidden');
    const previewHidden = previewPane.classList.contains('hidden');

    // Hide resize handle when either pane is hidden
    handle.classList.toggle('hidden', editorHidden || previewHidden);

    // Update button states
    btnEditor.classList.toggle('active', !editorHidden);
    btnPreview.classList.toggle('active', !previewHidden);

    // Disable a button if clicking it would hide both panes
    btnEditor.disabled = previewHidden && !editorHidden;
    btnPreview.disabled = editorHidden && !previewHidden;
  }

  // ---------- Resizable split pane ----------
  (function() {
    const handle = document.getElementById('resizeHandle');
    const container = document.querySelector('.container');
    const editorPane = document.querySelector('.editor-pane');
    const previewPane = document.querySelector('.preview-pane');

    handle.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      handle.classList.add('active');
      document.body.classList.add('resizing');

      const onMove = (e) => {
        const rect = container.getBoundingClientRect();
        const handleWidth = handle.offsetWidth;
        const available = rect.width - handleWidth;
        let editorWidth = e.clientX - rect.left;
        editorWidth = Math.max(available * 0.15, Math.min(available * 0.85, editorWidth));
        editorPane.style.width = editorWidth + 'px';
        editorPane.style.flex = 'none';
        previewPane.style.width = (available - editorWidth) + 'px';
        previewPane.style.flex = 'none';
      };

      const onUp = () => {
        handle.classList.remove('active');
        document.body.classList.remove('resizing');
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
      };

      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
    });

    handle.addEventListener('dblclick', () => {
      editorPane.style.flex = '';
      editorPane.style.width = '';
      previewPane.style.flex = '';
      previewPane.style.width = '';
    });
  })();

  // ---------- Toast ----------
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // ---------- Copy for Word ----------
  function copyForWord() {
    const clone = preview.cloneNode(true);

    // Styles to inline
    const stylesToInline = [
      'font-family', 'font-size', 'font-weight', 'font-style',
      'color', 'background-color', 'text-decoration',
      'text-align', 'margin', 'padding', 'line-height',
      'border', 'border-top', 'border-right', 'border-bottom', 'border-left',
      'border-collapse',
    ];

    // Walk original + clone in parallel to read computed styles from live DOM
    function walkAndInline(original, cloned) {
      if (original.nodeType !== 1) return;
      const cs = window.getComputedStyle(original);
      for (const prop of stylesToInline) {
        const val = cs.getPropertyValue(prop);
        if (val) cloned.style.setProperty(prop, val);
      }
      const origChildren = original.children;
      const cloneChildren = cloned.children;
      for (let i = 0; i < origChildren.length && i < cloneChildren.length; i++) {
        walkAndInline(origChildren[i], cloneChildren[i]);
      }
    }

    walkAndInline(preview, clone);

    // --- Transform elements for Word compatibility ---

    // Code blocks → ensure Courier New + inline syntax highlight colors
    clone.querySelectorAll('pre code').forEach(codeEl => {
      codeEl.style.fontFamily = "'Courier New', monospace";
      codeEl.style.fontSize = '13px';
      codeEl.querySelectorAll('span').forEach(span => {
        // Find the corresponding original span to get computed color
        // Since we already inlined, just ensure font-family is set
        span.style.fontFamily = "'Courier New', monospace";
      });
    });
    clone.querySelectorAll('code').forEach(codeEl => {
      codeEl.style.fontFamily = "'Courier New', monospace";
    });

    // Tables → add HTML attributes + inline border styles
    clone.querySelectorAll('table').forEach(table => {
      table.setAttribute('border', '1');
      table.setAttribute('cellpadding', '6');
      table.setAttribute('cellspacing', '0');
      table.style.borderCollapse = 'collapse';
      table.style.width = '100%';
    });
    clone.querySelectorAll('th, td').forEach(cell => {
      cell.style.border = '1px solid #cccccc';
      cell.style.padding = '6px 12px';
      cell.style.textAlign = 'left';
    });
    clone.querySelectorAll('th').forEach(th => {
      th.style.background = '#f0f0f0';
      th.style.fontWeight = '600';
    });

    // Task list checkboxes → Unicode ballot box characters
    clone.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      const span = document.createElement('span');
      span.textContent = cb.checked ? '\u2611 ' : '\u2610 ';
      cb.replaceWith(span);
    });

    // <mark> → <span> with inline background
    clone.querySelectorAll('mark').forEach(mark => {
      const span = document.createElement('span');
      span.style.backgroundColor = '#fff3a8';
      span.style.padding = '1px 3px';
      span.innerHTML = mark.innerHTML;
      mark.replaceWith(span);
    });

    // <ins> → <u>
    clone.querySelectorAll('ins').forEach(ins => {
      const u = document.createElement('u');
      u.style.color = '#16a34a';
      u.innerHTML = ins.innerHTML;
      ins.replaceWith(u);
    });

    // <abbr> → unwrap to plain text
    clone.querySelectorAll('abbr').forEach(abbr => {
      const text = document.createTextNode(abbr.textContent);
      abbr.replaceWith(text);
    });

    // <dl>/<dt>/<dd> → styled <p> elements
    clone.querySelectorAll('dl').forEach(dl => {
      const wrapper = document.createElement('div');
      for (const child of Array.from(dl.children)) {
        const p = document.createElement('p');
        if (child.tagName === 'DT') {
          p.style.fontWeight = '600';
          p.style.marginTop = '8px';
          p.style.marginBottom = '0';
        } else if (child.tagName === 'DD') {
          p.style.marginTop = '2px';
          p.style.marginBottom = '8px';
          p.style.marginLeft = '24px';
        }
        p.innerHTML = child.innerHTML;
        wrapper.appendChild(p);
      }
      dl.replaceWith(wrapper);
    });

    // Copy to clipboard as HTML + plain text
    const html = clone.innerHTML;
    const plainText = clone.innerText || clone.textContent;

    navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([plainText], { type: 'text/plain' }),
      })
    ]).then(() => {
      showToast('Copied to clipboard!');
    }).catch(() => {
      showToast('Copy failed — try again');
    });
  }
</script>

</body>
